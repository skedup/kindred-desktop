name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "11.7.0"
  RUST_VERSION: "1.88.0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tools and frontend dependencies
        run: |
          python -m pip install pillow pytest ruff
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir app install --frozen-lockfile
      - name: Check Python tools and visual pack
        run: |
          pytest -q
          ruff check .
          ruff format --check .
          python scripts/validate_visual_pack.py visual-packs/kindred-default
          python -m tools.visual_pipeline.eat_validate \
            --source-root visual-sources/kindred-default/eat-v2
          python -m tools.visual_pipeline.walk_validate \
            --source-root visual-sources/kindred-default/walk-v2
      - name: Check desktop frontend
        run: |
          pnpm --dir app test
          pnpm --dir app typecheck
          pnpm --dir app build
      - name: Require frontend lockfile to remain unchanged
        run: git diff --exit-code -- app/pnpm-lock.yaml

  macos-app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install fixed Rust, pnpm, and dependencies
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir app install --frozen-lockfile
      - name: Check Rust host
        run: |
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Build and validate Apple Silicon application
        run: pnpm --dir app bundle:macos-arm64
      - name: Require lockfiles to remain unchanged
        run: git diff --exit-code -- app/pnpm-lock.yaml app/src-tauri/Cargo.lock
