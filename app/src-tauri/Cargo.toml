[package]
name = "kindred-desktop-spirit"
version = "0.1.0"
description = "Kindred read-only macOS desktop spirit host"
authors = ["Kindred contributors"]
license = "Apache-2.0"
repository = "https://github.com/skedup/kindred-desktop"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kindred_desktop_spirit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tokio = { version = "1.53", features = ["macros", "sync", "time"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGSession"] }
objc2-foundation = { version = "0.3.2", features = ["block2", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
