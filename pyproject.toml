[project]
name = "kindred-desktop-tools"
version = "0.1.0"
description = "Validation and visual-production tools for Kindred Desktop"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=7.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

